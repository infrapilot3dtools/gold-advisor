<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الذهب</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b8860b">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#f4f1ea;--card:#ffffff;--tx:#1d2330;--mut:#6b7385;--line:#e6e1d6;--gold:#b8860b;--up:#188a5b;--down:#c8473d;--flat:#7a8394;--chip:#f1ede2}
[data-theme=dark]{--bg:#0f131a;--card:#181e28;--tx:#eef1f6;--mut:#9aa5b6;--line:#272f3c;--gold:#e6b84a;--up:#3fc08d;--down:#f0766b;--flat:#98a3b5;--chip:#212937}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6;font-size:17px}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 40px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.top h1{margin:0;font-size:22px;color:var(--gold);letter-spacing:.3px}
.icons button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;width:42px;height:42px;font-size:18px;cursor:pointer;margin-inline-start:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.lbl{color:var(--mut);font-size:14px;margin-bottom:2px}
.num{font-size:34px;font-weight:800;line-height:1.2;direction:ltr;unicode-bidi:plaintext}
.unit{color:var(--mut);font-size:13px;margin-top:2px}
.chg{font-size:14px;font-weight:600;direction:ltr}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.verdict{margin:14px 0 6px;padding:18px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex;gap:14px;align-items:center}
.arrow{font-size:44px;line-height:1;width:64px;text-align:center}
.vt{font-size:22px;font-weight:700}
.vs{color:var(--mut);font-size:15px;margin-top:2px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pill{background:var(--chip);border-radius:99px;padding:5px 12px;font-size:14px}
.pill b{direction:ltr;display:inline-block}
.calm{text-align:center;color:var(--mut);font-size:14px;margin:14px 0}
.late{text-align:center;font-size:13px;color:#b9770e;margin:4px 0}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:12px;padding:4px 14px}
summary{cursor:pointer;padding:12px 0;font-weight:700;font-size:17px}
details details{border:none;border-top:1px solid var(--line);border-radius:0;margin:0;padding:0}
details details summary{font-size:15px;font-weight:600}
.sec{padding:0 0 12px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{color:var(--mut);font-weight:600}
.ok{color:var(--up)}.stale{color:#b9770e}.unavailable{color:var(--down)}
.m{color:var(--mut);font-size:13px}
ul{margin:6px 0;padding-inline-start:20px}
.ltr{direction:ltr;display:inline-block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
input,select,button.b{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-family:inherit;font-size:14px}
button.b{cursor:pointer}
@media(max-width:560px){.grid{grid-template-columns:1fr}.num{font-size:30px}.card{display:flex;align-items:center;justify-content:space-between;text-align:right}.card .r{text-align:left}}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><h1>الذهب</h1>
  <div class="icons"><button id="rf" title="تحديث">⟳</button><button id="th" title="فاتح / داكن">◐</button></div></div>
 <div id="app" class="m">جاري التحميل...</div>
</div>
<script>
const $=s=>document.querySelector(s);
const root=document.documentElement;
const qp=new URLSearchParams(location.search);
root.dataset.theme=qp.get("t")||localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
$("#th").onclick=()=>{root.dataset.theme=root.dataset.theme==="dark"?"light":"dark";localStorage.setItem("theme",root.dataset.theme)};
const f=(v,d=0)=>v==null?"-":Number(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=(v,d=1)=>v==null?"-":(v>0?"+":"")+f(v,d);
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const stTxt={ok:"سليمة",stale:"متأخرة",unavailable:"غير متاحة"};
let openState=qp.get("open")?{all:true,why:true,prices:true,health:true,paper:true,set:true}:{};
function keepOpen(){document.querySelectorAll("details[data-k]").forEach(d=>openState[d.dataset.k]=d.open)}
function det(k,title,body,inner){return `<details data-k="${k}" ${openState[k]?"open":""}><summary>${title}</summary><div class="sec">${body}</div></details>`}
function verdict(s){
 const g=s.direction.groups, t=g[0].score, m=g[1].score;
 if(t==null)return{arrow:"•",cls:"flat",title:"مفيش بيانات كفاية لحد دلوقتي",sub:"استنى لحد ما البيانات تتحمل."};
 let cls,arrow,title;
 if(t>=0.6){cls="up";arrow="▲";title="الذهب في اتجاه صاعد"}
 else if(t<=-0.6){cls="down";arrow="▼";title="الذهب في اتجاه هابط"}
 else{cls="flat";arrow="►";title="الذهب متذبذب ومن غير اتجاه واضح"}
 let sub;
 if(m==null)sub="مش قادر أحكم على الفايدة والدولار دلوقتي.";
 else if(m>0)sub="والفايدة والدولار في صالح الذهب.";
 else if(m<0)sub="والفايدة والدولار مش في صالحه دلوقتي.";
 else sub="والفايدة والدولار متعادلين.";
 return{arrow,cls,title,sub};
}
async function load(){
 keepOpen();
 let j; try{j=await (await fetch("data.json?_="+Date.now(),{cache:"no-store"})).json()}catch(e){$("#app").textContent="مش قادر أحمّل البيانات. جرّب تاني بعد شوية.";return}
 const genAge=(Date.now()-new Date(j.generatedAt).getTime())/3600000;
 const s=j.state,P=s.price,L=s.local,v=verdict(s);
 let h="";
 // hero numbers
 let ch="",chc="flat";
 if(P.available&&P.prev>0){const c=(P.close/P.prev-1)*100;ch=sg(c,2)+"%";chc=c>0?"up":c<0?"down":"flat"}
 h+=`<div class="grid">`;
 h+=`<div class="card"><div class="l"><div class="lbl">الذهب عالميًا</div><div class="unit">دولار للأونصة</div></div><div class="r"><div class="num">${P.available?"$"+f(P.close,0):"-"}</div><div class="chg ${chc}">${ch}</div></div></div>`;
 const egAge=L.egyptTime?(Date.now()-new Date(L.egyptTime).getTime())/3600000:null;
 const egOld=egAge!=null&&egAge>18;
 const eg=L.egyptK?L.egyptK["21"]:(L.egyptVal||null);
 h+=`<div class="card"><div class="l"><div class="lbl">عيار 21 في مصر</div><div class="unit">جنيه للجرام${egOld?" (آخر سعر)":""}</div></div><div class="r"><div class="num">${eg?f(eg,0):"-"}</div></div></div>`;
 const sa=L.saudi&&L.saudi["21"];
 h+=`<div class="card"><div class="l"><div class="lbl">عيار 21 في السعودية</div><div class="unit">ريال للجرام (تقديري)</div></div><div class="r"><div class="num">${sa?f(sa,0):"-"}</div></div></div>`;
 h+=`</div>`;
 // verdict
 h+=`<div class="verdict"><div class="arrow ${v.cls}">${v.arrow}</div><div><div class="vt ${v.cls}">${v.title}</div><div class="vs">${v.sub}</div></div></div>`;
 h+=`<div class="pills">`+s.horizons.map((x,i)=>`<span class="pill">${["آخر شهر","آخر 3 شهور","آخر سنة"][i]}: <b class="${x.goldRet>0?"up":x.goldRet<0?"down":"flat"}">${sg(x.goldRet,1)}%</b></span>`).join("")+`</div>`;
 const late=s.health.some(x=>x.status!=="ok")||genAge>6||egOld;
 if(genAge>6)h+=`<div class="late">آخر تحديث للبيانات من ${Math.round(genAge)} ساعة، يمكن التحديث متأخر</div>`;else if(late)h+=`<div class="late">بعض البيانات متأخرة، التفاصيل تحت</div>`;
 h+=`<div class="calm">أداة مساعدة، مش توصية<br><span style="font-size:12px">آخر تحديث: ${new Date(j.generatedAt).toLocaleString("ar-EG",{dateStyle:"medium",timeStyle:"short"})}</span></div>`;
 // details
 let d="";
 const g=s.direction.groups;
 d+=det("why","ليه كده؟",`${g.map(x=>`<b>${esc(x.name)}</b><ul>${(x.items||[]).map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`).join("")}
   <div class="m">درجة الأدلة: <span class="ltr">${sg(s.direction.score,2)}</span> من -1 إلى +1 (${esc(s.direction.label)}). التغير في الذهب مقارنة بالفترات السابقة:</div>
   <table><tr><th>الفترة</th><th>الذهب %</th><th>العائد الحقيقي</th><th>الدولار %</th></tr>${s.horizons.map(x=>`<tr><td>${esc(x.name)}</td><td><span class="ltr">${sg(x.goldRet,1)}</span></td><td><span class="ltr">${sg(x.realChg,2)}</span></td><td><span class="ltr">${sg(x.usdChg,2)}</span></td></tr>`).join("")}</table>`);
 d+=det("prices","الأسعار بالتفصيل",`<b>مصر:</b> ${esc(L.egyptText)}${L.egyptK?`<div>عيار 24: ${f(L.egyptK["24"])} | عيار 21: ${f(L.egyptK["21"])} | عيار 18: ${f(L.egyptK["18"])} | جنيه الذهب: ${f(L.egyptK.pound)}</div>`:""}<div class="m">${esc((L.egyptNote||"").replace(/، \d+ ساعة مضت/,""))}</div>
   <br><b>السعودية (ريال/جرام):</b> ${L.saudi&&L.saudi["24"]?`عيار 24: ${f(L.saudi["24"],1)} | 22: ${f(L.saudi["22"],1)} | 21: ${f(L.saudi["21"],1)} | 18: ${f(L.saudi["18"],1)}`:"مخفي"}<div class="m">${esc(L.saudiNote)}</div>
   <br><b>الذهب عالميًا:</b> ${P.available?`${f(P.close,2)} دولار للأونصة بتاريخ ${P.date}${P.partial?" (اليوم لسه ماخلصش)":""}`:"-"}<div class="m">${esc(P.label||"")}</div>`);
 d+=det("health","حالة البيانات",`<table><tr><th>المصدر</th><th>آخر بيان</th><th>الحالة</th></tr>${s.health.map(x=>`<tr><td>${esc(x.name)}<div class="m">${esc(x.source)}${x.lastErr?` | خطأ: ${esc(x.lastErr)}`:""}</div></td><td><span class="ltr">${x.lastObs}</span><div class="m">${x.ageDays<0?"":x.ageDays+" يوم"}</div></td><td class="${x.status}">${stTxt[x.status]}</td></tr>`).join("")}</table>`);
 const p=s.paper;
 d+=det("paper","النموذج التجريبي (محاكاة بدون فلوس)",`<b>${esc(p.stateText)}</b><ul>${(p.details||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
   <div class="m">الدخول الجديد متوقف لأن: <ul>${p.gates.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${esc(p.params)}</div>
   ${p.trades&&p.trades.length?`<table><tr><th>دخول</th><th>خروج</th><th>%</th><th>السبب</th></tr>${p.trades.map(t=>`<tr><td>${t.entry}</td><td>${t.exit}</td><td><span class="ltr">${sg(t.ret,1)}</span></td><td>${esc(t.reason)}</td></tr>`).join("")}</table><div class="m">آخر صفقات المحاكاة على البيانات القديمة، بدون عمولات، وليست نتيجة مثبتة.</div>`:""}`);
 d+=det("help","إزاي تقرأ الشاشة؟",`<ul>
   <li>الأداة بتوصف حالة السوق من أسعار الذهب والفايدة الحقيقية ومؤشر الدولار. هي مش بتتوقع الأسعار ومش بتوعد بربح.</li>
   <li>سعر الذهب العالمي هو العقود الآجلة (COMEX)، قريب من السعر الفوري بس مش نفسه.</li>
   <li>سعر مصر من قناة تيليجرام عامة، وهو إرشادي بدون مصنعية وبدون تحديد بيع أو شراء. سعر السعودية تقدير حسابي من سعر الأونصة، بدون ضريبة ومصنعية.</li>
   <li>"هابط" معناها الظروف ضد الذهب، مش نصيحة بالبيع.</li>
   <li>الأرقام والحدود المستخدمة تجريبية ولسه ماتختبرتش.</li></ul>`);
 d+=det("set","عن البيانات",`<div class="m">البيانات بتتحدث تلقائيا من السيرفر كل ساعة تقريبا (جيت هاب). مفيش حاجة تعملها. آخر تحديث: ${j.generatedAt}</div>`);
 h+=`<details data-k="all" ${openState.all?"open":""}><summary>تفاصيل</summary><div class="sec">${d}</div></details>`;
 $("#app").className="";$("#app").innerHTML=h;
 

}
$("#rf").onclick=()=>load();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
load();setInterval(load,60000);
</script>
</body></html>
