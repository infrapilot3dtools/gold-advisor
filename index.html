<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الذهب</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#b8860b">
<style>
:root{--bg:#f4f1ea;--card:#fff;--line:#e6dfd0;--tx:#1c2030;--mu:#6b6f80;--up:#1f8a4c;--dn:#c0392b;--ac:#b8860b;--w:#fff3cd}
[data-t=dark]{--bg:#12141b;--card:#1c202b;--line:#2b3040;--tx:#eceff6;--mu:#9aa1b5;--up:#41c57a;--dn:#ff6b5c;--w:#3a3115}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);max-width:520px;margin:0 auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;color:var(--ac);margin:4px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.g .card{margin:0;text-align:center;padding:12px 6px}
.s{font-size:12px;color:var(--mu)}.big{font-size:26px;font-weight:700;margin:4px 0}
.tr{display:flex;align-items:center;gap:14px}.ar{font-size:54px;line-height:1}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--mu)}
.warn{background:var(--w);border-color:#e0c36a}button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;width:42px;height:42px;font-size:18px}
input{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--bg);color:var(--tx)}
.sv{background:var(--ac);color:#fff;width:auto;padding:0 18px;border:0}
</style></head><body>
<div class="top"><h1>الذهب</h1><button id="th" title="فاتح / داكن">◐</button></div>
<div id="stale"></div>
<div class="card"><div class="tr"><div class="ar" id="ar">…</div><div><div class="big" id="tt">بحمّل…</div><div id="rec" class="s" style="font-size:14px;color:var(--tx)"></div></div></div><div class="s" id="ch" style="margin-top:8px"></div></div>
<div class="s" style="margin:8px 4px 0">مصر (جنيه للجرام)</div>
<div class="g"><div class="card"><div class="s">عيار 24</div><div class="big" id="k24">-</div></div><div class="card"><div class="s">عيار 21</div><div class="big" id="k21">-</div></div><div class="card"><div class="s">عيار 18</div><div class="big" id="k18">-</div></div></div>
<div class="card"><div class="s">جنيه الذهب</div><div class="big" id="pd">-</div><div class="s">الأسعار من غير مصنعية</div></div>
<div class="s" style="margin:8px 4px 0">السعودية (ريال للجرام، تقديري)</div>
<div class="g"><div class="card"><div class="s">عيار 24</div><div class="big" id="s24">-</div></div><div class="card"><div class="s">عيار 21</div><div class="big" id="s21">-</div></div><div class="card"><div class="s">عيار 18</div><div class="big" id="s18">-</div></div></div>
<div class="card"><div class="s">الذهب عالميا</div><div class="big" id="oz">-</div><div class="s">دولار للأونصة</div></div>
<div class="card"><b>سعر المحل عندك</b><div class="s">اكتب سعر جرام 21 زي ما المحل قالك، وهقارنه بالسعر هنا.</div>
<input id="shop" inputmode="decimal" placeholder="جنيه للجرام"><button class="sv" id="sv">احفظ</button><div id="shopout" class="s" style="margin-top:8px"></div></div>
<div class="card s" id="foot"></div>
<script>
const $=i=>document.getElementById(i),f=(x,d=0)=>x==null?"-":Number(x).toLocaleString("en-US",{maximumFractionDigits:d});
const T=localStorage.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.dataset.t=T;
$("th").onclick=()=>{const n=document.documentElement.dataset.t==="dark"?"light":"dark";document.documentElement.dataset.t=n;localStorage.theme=n};
let egp=null;
function ago(ms){const m=Math.round(ms/60000);return m<60?m+" دقيقة":m<2880?Math.round(m/60)+" ساعة":Math.round(m/1440)+" يوم"}
function shop(){const s=JSON.parse(localStorage.shop||"null");if(!s){$("shopout").textContent="";return}
 let o="سعر المحل: "+f(s.v)+" جنيه";if(egp)o+=" - الفرق عن السعر هنا: "+((s.v-egp)/egp*100).toFixed(1)+"%";
 if(Date.now()-s.t>43200000)o+=" - <b>قديم، حدّثه</b>";$("shopout").innerHTML=o}
$("sv").onclick=()=>{const v=parseFloat($("shop").value);if(v){localStorage.shop=JSON.stringify({v,t:Date.now()});shop()}};
(async()=>{let j;try{j=await (await fetch("data.json?_="+Date.now(),{cache:"no-store"})).json()}catch(e){$("tt").textContent="مش قادر أحمّل الأسعار";$("ar").textContent="";return}
 const p=j.price,age=Date.now()-new Date(p.t).getTime(),gen=Date.now()-new Date(j.generatedAt).getTime();
 egp=p.k21;$("k24").textContent=f(p.k24);$("k21").textContent=f(p.k21);$("k18").textContent=f(p.k18);$("pd").textContent=f(p.pound);
 if(p.oz){$("oz").textContent="$"+f(p.oz,1);const g=p.oz/31.1035*3.75;$("s24").textContent=f(g,0);$("s21").textContent=f(g*.875,0);$("s18").textContent=f(g*.75,0)}
 const M={up:["▲","up","صاعد","الذهب طالع. لو ناوي تشتري، راقب لأن السعر أعلى من قبل."],down:["▼","dn","هابط","الذهب نازل. ممكن تستنى لحد ما السعر يثبت قبل الشراء."],flat:["◆","fl","عرضي","مفيش اتجاه واضح دلوقتي."],unknown:["…","fl","لسه بجمع بيانات","محتاج وقت أكتر عشان أحدد الاتجاه."]}[j.trend];
 $("ar").textContent=M[0];$("ar").className="ar "+M[1];$("tt").textContent="الاتجاه: "+M[2];$("tt").className="big "+M[1];$("rec").textContent=M[3];
 const r=[];if(j.short)r.push("آخر "+Math.round(j.short.hours)+" ساعة: "+j.short.pct+"%");if(j.d1)r.push("يوم: "+j.d1.pct+"%");if(j.d7)r.push("أسبوع: "+j.d7.pct+"%");$("ch").textContent=r.join("  |  ")+" (عيار 21)";
 if(age>10800000||gen>10800000)$("stale").innerHTML='<div class="card warn"><b>تنبيه:</b> الأسعار قديمة (عمرها '+ago(Math.min(age,1e15))+'). مش بتتحدث دلوقتي.</div>';
 $("foot").innerHTML="أداة مساعدة، مش توصية ومفيش ضمان. سعر مصر من قناة تليجرام «أسعار الذهب»، آخر سعر من "+ago(age)+" (وقت السعر: "+new Date(p.t).toLocaleString("ar-EG")+"). سعر السعودية بالحساب من السعر العالمي، من غير ضريبة ومصنعية. الصفحة بتتحدث بشكل دوري ومش لحظيا.";shop()})();
</script></body></html>
