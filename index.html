<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الذهب - نسخة تجريبية</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<style>body{font-family:sans-serif;background:#f4f1ea;color:#1c2030;max-width:520px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid #e3ddd0;border-radius:16px;padding:16px;margin:12px 0}
.demo{background:#fff3cd;border-color:#e0c36a}input{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:10px;font-size:16px}
button{padding:10px 16px;border:0;border-radius:10px;background:#b8860b;color:#fff;font-size:16px}.big{font-size:32px;font-weight:bold}.warn{color:#b9770e}</style></head><body>
<h2 style="color:#b8860b">الذهب</h2>
<div class="card demo"><b>نسخة تجريبية - مفيش بيانات حية.</b><br>الصفحة دي مش بتجيب أسعار تلقائيا. مفيش تحديث كل ساعة. أداة مساعدة، مش توصية.</div>
<div class="card"><b>إدخال يدوي</b>
<input id="p" inputmode="decimal" placeholder="سعر الذهب (دولار للأونصة)">
<input id="q" inputmode="decimal" placeholder="سعر الإغلاق السابق">
<input id="e" inputmode="decimal" placeholder="سعر عيار 21 في مصر (جنيه) - اختياري">
<button id="s">احسب واحفظ</button></div>
<div class="card" id="out">مفيش بيانات مدخلة.</div>
<script>
const $=i=>document.getElementById(i);
function show(){const d=JSON.parse(localStorage.getItem("gold")||"null");if(!d){return}
const ch=d.q?((d.p-d.q)/d.q*100).toFixed(2):null;const age=(Date.now()-d.t)/3600000;
$("out").innerHTML=`<div class="big">$${d.p}</div>${ch!==null?`<div>التغير: ${ch}%</div>`:""}${d.e?`<div>عيار 21 مصر: ${d.e} جنيه</div>`:""}
<div style="font-size:13px;margin-top:8px">أدخلتها يدويا: ${new Date(d.t).toLocaleString("ar-EG")} (من ${age<1?"أقل من ساعة":Math.floor(age)+" ساعة"})</div>
${age>6?'<div class="warn">تنبيه: الأرقام قديمة، حدّثها.</div>':""}`}
$("s").onclick=()=>{const p=parseFloat($("p").value);if(!p)return;localStorage.setItem("gold",JSON.stringify({p,q:parseFloat($("q").value)||0,e:parseFloat($("e").value)||0,t:Date.now()}));show()};
show();
</script></body></html>
